name: CI

# Phase 1 CI (17 section 3 item 8; research/19-phase1-handoff.md section 3.3). Offline, synthetic tests only.
# Actions are pinned by commit: actions/checkout v4 = 11d5960a, actions/setup-python v5 = a26af69b.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: typing, tests, fixture, import boundary (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the hash-locked development tools
        run: python -m pip install --require-hashes --no-deps -r requirements/dev.txt
      - name: Strict type check
        run: python -m mypy
      - name: Tests (property and fault-injection tests included)
        run: python -m pytest
      - name: Restore fixture is reproducible from its generator (T-08)
        run: |
          python -I tests/fixtures/restore/make_fixture.py
          git diff --exit-code -- tests/fixtures/restore
      - name: Static import boundary (no network facility, no executor import from research code)
        run: python tools/check_import_boundary.py cpe

  restore-container:
    name: restore from a clean checkout in a container (T-08)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.13-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the hash-locked development tools
        run: python -m pip install --require-hashes --no-deps -r requirements/dev.txt
      - name: Replay the committed export and compare the state digest
        run: |
          python -m pytest tests/test_restore.py
          python -c "import json; print('expected', json.load(open('tests/fixtures/restore/expected.json')))"

  provenance:
    name: attribution, commit identity and merge-message labels (T-09)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Pull request text and commits against the head tree (before the merge)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path('/tmp/pr_title').write_text(os.environ['PR_TITLE'], encoding='utf-8')
          pathlib.Path('/tmp/pr_body').write_text(os.environ.get('PR_BODY') or '', encoding='utf-8')
          PY
          python tools/check_provenance.py --range "$BASE_SHA..$HEAD_SHA" --head "$HEAD_SHA" \
            --title-file /tmp/pr_title --body-file /tmp/pr_body
      - name: Commits the push added, each against its own tree (after the merge)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch: no range to check"; exit 0
          fi
          python tools/check_provenance.py --range "$BEFORE_SHA..$AFTER_SHA" --head "$AFTER_SHA"

  archive:
    name: research/original unchanged by manifest and tree (T-41)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sh tools/check_archive.sh

  lean:
    name: retained Lean lemmas and the known-false lemma on the pinned toolchain (T-40)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build, print axioms, compile the negative control; any infrastructure failure is NOT VERIFIED
        run: sh tools/lean_check.sh
