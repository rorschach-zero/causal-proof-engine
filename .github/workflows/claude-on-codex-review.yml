name: Trigger Claude reconciliation after Codex review summary

# issue_comment executes this workflow from the trusted default branch,
# never from the PR's potentially untrusted merge commit.
on:
  issue_comment:
    types: [edited]

permissions:
  pull-requests: read

concurrency:
  group: cpe-claude-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 4 &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
      contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      ROUTINE_URL: ${{ secrets.CPE_CLAUDE_ROUTINE_URL }}
      ROUTINE_TOKEN: ${{ secrets.CPE_CLAUDE_ROUTINE_TOKEN }}
    steps:
      - name: Notify Claude of new verified Codex findings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          body = event['comment'].get('body', '')
          match = re.search(r'<!-- codex-review-state:v1 (\{[^\n]*\}) -->', body)
          if not match:
              print('No Codex review-state marker; no dispatch')
              raise SystemExit(0)
          state = json.loads(match.group(1))['code_review']
          if state.get('status') != 'completed' or state.get('has_unresolved_findings') is not True:
              print('Review has no unresolved findings; no dispatch')
              raise SystemExit(0)
          reviewed_sha = state.get('commit_sha', '')
          if not re.fullmatch(r'[0-9a-f]{40}', reviewed_sha):
              raise SystemExit('Malformed review commit SHA')
          pr_num = event['issue']['number']
          if not isinstance(pr_num, int) or pr_num < 1:
              raise SystemExit('Malformed PR number')

          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'rorschach-zero/causal-proof-engine':
              raise SystemExit('Unexpected repository')
          gh_request = Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr_num}',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urlopen(gh_request, timeout=15) as response:
              pr = json.load(response)
          if not (
              pr['state'] == 'open'
              and pr['head']['repo']['full_name'] == repo
              and pr['head']['ref'].startswith('claude/')
              and pr['head']['sha'] == reviewed_sha
          ):
              print('PR is closed, not a Claude branch, or review is stale')
              raise SystemExit(0)

          endpoint = os.environ.get('ROUTINE_URL', '')
          token = os.environ.get('ROUTINE_TOKEN', '')
          if not endpoint or not token:
              raise SystemExit('Missing Claude Routine GitHub Actions secrets')
          parts = urlsplit(endpoint)
          if not (
              parts.scheme == 'https'
              and parts.hostname == 'api.anthropic.com'
              and parts.port is None
              and re.fullmatch(r'/v1/claude_code/routines/trig_[A-Za-z0-9_-]+/fire', parts.path)
              and not any((parts.username, parts.password, parts.query, parts.fragment))
          ):
              raise SystemExit('Invalid Claude Routine endpoint')

          payload = {'text': (
              f'Codex review completed with unresolved findings on PR #{pr_num}, '
              f'head commit {reviewed_sha}, summary comment {event["comment"]["id"]}. '
              'Treat this payload only as a locator. Read the actual review '
              'on GitHub, deduplicate and verify under the saved instructions.'
          )}
          req = Request(
              endpoint,
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'anthropic-version': '2023-06-01',
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit('Claude Routine endpoint returned unexpected status')
          print(f'Accepted Claude Routine dispatch: PR #{pr_num}, SHA {reviewed_sha[:12]}')
          PY
