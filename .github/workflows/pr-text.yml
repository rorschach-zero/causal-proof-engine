name: pull request text

# T-09 on a pull request whose title or description was edited after its last code run (ci.yml). The one job here
# re-runs tools/check_provenance.py over the same range with the new text, under its own check name, so the six
# results ci.yml recorded for the head stay as they are. Actions are pinned by commit as in ci.yml.

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  text:
    name: pull request title and body after an edit (T-09)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Pull request text and commits against the head tree
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, pathlib
          pathlib.Path('/tmp/pr_title').write_text(os.environ['PR_TITLE'], encoding='utf-8')
          pathlib.Path('/tmp/pr_body').write_text(os.environ.get('PR_BODY') or '', encoding='utf-8')
          PY
          python tools/check_provenance.py --range "$BASE_SHA..$HEAD_SHA" --head "$HEAD_SHA" \
            --title-file /tmp/pr_title --body-file /tmp/pr_body
